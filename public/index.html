<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Satellite</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Instrument+Serif:ital@0;1&family=Source+Code+Pro:wght@300;400;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet" />

  <link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/satellite.js/4.0.0/satellite.min.js"></script>

  <link rel="stylesheet" href="/css/app.css?v=__BUILD__" />
  <script>window.MAPBOX_TOKEN = window.MAPBOX_TOKEN || "";</script>
</head>
<body>

<div id="map"></div>
<canvas id="sat-canvas"></canvas>
<div id="sat-labels"></div>
<div id="grain"></div>

<div id="masthead">
  <div id="masthead-left">
    <span id="masthead-vol">Vol. I</span>
  </div>
  <span id="masthead-title">Daily Satellite</span>
  <div id="masthead-right">
    <div id="clock"></div>
    <div id="season-label"></div>
  </div>
</div>

<div id="daily-card">
  <div id="daily-card-issue"></div>
  <div id="daily-card-name"></div>
  <div id="daily-card-desc"></div>
  <div id="daily-card-cta">Open today's entry →</div>
</div>

<div id="sat-count"></div>
<div id="season-indicator"></div>

<!-- INFO PANEL -->
<div id="info-panel">
  <div id="panel-handle"></div>
  <div id="panel-header">
    <div id="panel-sat-type">◆ Loading</div>
    <div id="panel-header-controls">
      <button class="panel-ctrl" id="ctrl-listen">▶ Listen</button>
      <button class="panel-ctrl" id="ctrl-collapse">Collapse</button>
      <button class="panel-ctrl" id="ctrl-close">Close</button>
    </div>
  </div>
  <div id="panel-body">
    <div id="panel-fade-top"></div>
    <div id="panel-text-content">
      <p id="panel-loading">The archivist is searching the files</p>
    </div>
    <div id="panel-fade-bottom"></div>
  </div>
  <div id="panel-name-row">
    <div id="panel-sat-name">—</div>
    <div id="panel-sat-agency"></div>
  </div>
  <div id="panel-data-strip">
    <div id="panel-data-block"></div>
  </div>
</div>

<script src="/js/orbit.js?v=__BUILD__" defer></script>
<script src="/js/projector.js?v=__BUILD__" defer></script>
<script src="/js/scene.js?v=__BUILD__" defer></script>
<script src="/js/ui.js?v=__BUILD__" defer></script>
<script src="/js/main.js?v=__BUILD__" defer></script>
</body>
</html>

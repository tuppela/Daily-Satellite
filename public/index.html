<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Satellite</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Instrument+Serif:ital@0;1&family=Source+Code+Pro:wght@300;400;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Josefin+Sans:wght@300;400;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/satellite.js/4.0.0/satellite.min.js"></script>

  <link rel="stylesheet" href="/css/app.css?v=__BUILD__" />
  <script>window.MAPBOX_TOKEN = window.MAPBOX_TOKEN || "";</script>
</head>
<body>

<div id="map"></div>
<canvas id="sat-canvas"></canvas>
<div id="sat-labels"></div>
<div id="grain"></div>

<div id="masthead">
  <span id="masthead-title">Daily Satellite</span>
</div>

<!-- Only shown when something needs saying (loading, no data, no WebGL). -->
<div id="sat-count"></div>

<!-- STORY PLAYER
     Two looks: .visible (open) and .collapsed (hidden, the pill below takes over). -->
<aside id="info-panel" aria-label="Story">
  <div id="panel-card">
    <div id="panel-body">
      <div id="panel-fade-top"></div>
      <div id="panel-text-content">
        <p id="panel-loading">The archivist is searching the files</p>
      </div>
      <div id="panel-fade-bottom"></div>
    </div>
    <div id="panel-controls">
      <div class="ctrl-cell ctrl-start">
        <button class="round ghost" id="ctrl-close" type="button" aria-label="Close story">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg>
        </button>
        <button class="round ghost" id="ctrl-share" type="button" aria-label="Share this entry">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4.5M7.5 8.5L12 4l4.5 4.5M6 12.5v6.5h12v-6.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
        </button>
      </div>
      <div class="ctrl-cell ctrl-mid">
        <button class="round ghost" id="ctrl-prev" type="button" aria-label="Previous satellite">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 6.5v11L3.5 12zM20.5 6.5v11L13 12z" fill="currentColor"/></svg>
        </button>
        <button class="round solid play" id="ctrl-listen" type="button" data-state="idle" aria-label="Play narration" disabled>
          <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.2v13.6L19 12z" fill="currentColor"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.2" y="5" width="4.2" height="14" rx="1.1" fill="currentColor"/><rect x="13.6" y="5" width="4.2" height="14" rx="1.1" fill="currentColor"/></svg>
          <svg class="i-load" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.6" fill="none" stroke="currentColor" stroke-width="2.8"/><g fill="currentColor"><rect x="10.35" y="4.4" width="3.3" height="3.7" rx="0.7" transform="rotate(0 12 12)"/><rect x="10.35" y="4.4" width="3.3" height="3.7" rx="0.7" transform="rotate(60 12 12)"/><rect x="10.35" y="4.4" width="3.3" height="3.7" rx="0.7" transform="rotate(120 12 12)"/><rect x="10.35" y="4.4" width="3.3" height="3.7" rx="0.7" transform="rotate(180 12 12)"/><rect x="10.35" y="4.4" width="3.3" height="3.7" rx="0.7" transform="rotate(240 12 12)"/><rect x="10.35" y="4.4" width="3.3" height="3.7" rx="0.7" transform="rotate(300 12 12)"/></g></svg>
        </button>
        <button class="round ghost" id="ctrl-next" type="button" aria-label="Next satellite">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 6.5v11l7.5-5.5zM3.5 6.5v11L11 12z" fill="currentColor"/></svg>
        </button>
      </div>
      <div class="ctrl-cell ctrl-end">
        <button class="round ghost" id="ctrl-collapse" type="button" aria-label="Collapse to a small player">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 12h11" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg>
        </button>
      </div>
    </div>
  </div>
  <div id="panel-plate">
    <div id="panel-chips"><span id="panel-sat-type"></span><span id="panel-sat-theme"></span></div>
    <div id="panel-sat-name">Loading</div>
    <div id="panel-extra">
      <div id="panel-sat-agency"></div>
      <div id="panel-data-block"></div>
    </div>
  </div>
</aside>

<!-- The small player: the story carries on, the globe has the room. -->
<div id="mini-player" role="group" aria-label="Story player">
  <button class="round ghost small" id="mini-close" type="button" aria-label="Close story">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg>
  </button>
  <button class="round ghost" id="mini-expand" type="button" aria-label="Open the full story">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 5h5v5M10 19H5v-5M19 5l-6.5 6.5M5 19l6.5-6.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
  </button>
  <div id="mini-title"></div>
  <button class="round solid play" id="mini-play" type="button" data-state="idle" aria-label="Play narration" disabled>
    <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.2v13.6L19 12z" fill="currentColor"/></svg>
    <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.2" y="5" width="4.2" height="14" rx="1.1" fill="currentColor"/><rect x="13.6" y="5" width="4.2" height="14" rx="1.1" fill="currentColor"/></svg>
    <svg class="i-load" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.6" fill="none" stroke="currentColor" stroke-width="2.8"/><g fill="currentColor"><rect x="10.35" y="4.4" width="3.3" height="3.7" rx="0.7" transform="rotate(0 12 12)"/><rect x="10.35" y="4.4" width="3.3" height="3.7" rx="0.7" transform="rotate(60 12 12)"/><rect x="10.35" y="4.4" width="3.3" height="3.7" rx="0.7" transform="rotate(120 12 12)"/><rect x="10.35" y="4.4" width="3.3" height="3.7" rx="0.7" transform="rotate(180 12 12)"/><rect x="10.35" y="4.4" width="3.3" height="3.7" rx="0.7" transform="rotate(240 12 12)"/><rect x="10.35" y="4.4" width="3.3" height="3.7" rx="0.7" transform="rotate(300 12 12)"/></g></svg>
  </button>
</div>

<script src="/js/orbit.js?v=__BUILD__" defer></script>
<script src="/js/projector.js?v=__BUILD__" defer></script>
<script src="/js/scene.js?v=__BUILD__" defer></script>
<script src="/js/follow.js?v=__BUILD__" defer></script>
<script src="/js/ui.js?v=__BUILD__" defer></script>
<script src="/js/main.js?v=__BUILD__" defer></script>
</body>
</html>
